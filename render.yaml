services:
  - type: web
    name: mole-pop-game
    runtime: static
    buildCommand: echo "Static game ready"
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

