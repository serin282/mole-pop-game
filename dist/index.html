<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#78cf68" />
  <title>두더지 팡팡!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    :root{--ink:#4f3828;--cream:#fff8df;--green:#79cf69;--green2:#b7e77b;--brown:#67402e;--orange:#ff8b43;--yellow:#ffd84d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:'Jua','Arial Rounded MT Bold',sans-serif;color:var(--ink);overflow-x:hidden}
    body{min-height:100svh;background:linear-gradient(#b9ebff 0 25%,#b3e87c 25% 100%);display:grid;place-items:center;padding:18px;user-select:none}
    body:before{content:"";position:fixed;inset:20% 0 auto;height:70px;background:radial-gradient(ellipse at 10% 100%,#fff 0 23%,transparent 24%),radial-gradient(ellipse at 24% 100%,#fff 0 27%,transparent 28%),radial-gradient(ellipse at 90% 100%,#fff 0 23%,transparent 24%),radial-gradient(ellipse at 75% 100%,#fff 0 27%,transparent 28%);opacity:.75;pointer-events:none}
    .game{position:relative;width:min(620px,100%);z-index:1}
    header{text-align:center;margin-bottom:10px}
    h1{margin:0;color:#fff;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:2px;text-shadow:0 5px 0 #6aaf51,0 8px 16px #4a9a5866;-webkit-text-stroke:2px #5f963f}
    .tag{display:inline-block;background:#fff8dfcc;padding:5px 16px;border-radius:30px;font-size:.95rem;box-shadow:0 3px 0 #82b85b;margin-top:4px}
    .hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto;width:min(470px,100%)}
    .stat{background:var(--cream);border:4px solid #fff;border-radius:24px;padding:9px 16px;box-shadow:0 6px 0 #73b653,0 9px 16px #4f823c44;display:flex;justify-content:space-between;align-items:center;font-size:1rem}
    .stat strong{font-size:1.55rem;color:#ef6939;font-variant-numeric:tabular-nums}
    .board-wrap{position:relative;background:#93d765;border:5px solid #d8f2a2;border-radius:38px;padding:24px clamp(14px,5vw,34px) 30px;box-shadow:inset 0 -10px 0 #64b953,0 12px 0 #4d963f,0 18px 25px #467a3c55}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,24px)}
    .hole{position:relative;aspect-ratio:1.22/1;border:0;background:transparent;padding:0;cursor:pointer;overflow:hidden;touch-action:manipulation}
    .hole:focus-visible{outline:4px solid #fff;outline-offset:3px;border-radius:45%}
    .dirt{position:absolute;left:5%;right:5%;bottom:3%;height:42%;border-radius:50%;background:#4a2a25;box-shadow:inset 0 9px 0 #321c1a,0 8px 0 #86523a,0 12px 8px #487f3944;z-index:1}
    .mole{position:absolute;z-index:2;width:72%;height:89%;left:14%;bottom:-88%;border-radius:50% 50% 38% 38%;background:linear-gradient(145deg,#9a6849 0 55%,#70432f 100%);border:4px solid #5f3b2c;transition:bottom .2s cubic-bezier(.2,1.4,.5,1),transform .14s,opacity .14s;pointer-events:none;filter:drop-shadow(0 5px 3px #30492244)}
    .active .mole{bottom:12%}.hit .mole{transform:scale(.55) rotate(10deg);opacity:0}
    .mole:before,.mole:after{content:"";position:absolute;top:9%;width:23%;aspect-ratio:1;border-radius:50%;background:#b77d69;border:4px solid #5f3b2c;z-index:-1;box-shadow:inset 0 0 0 5px #d99b8a}.mole:before{left:-7%}.mole:after{right:-7%}
    .face{position:absolute;inset:0}.eyes:before,.eyes:after{content:"";position:absolute;top:30%;width:12%;aspect-ratio:1;border-radius:50%;background:#241b19;box-shadow:inset 3px 3px #fff}.eyes:before{left:24%}.eyes:after{right:24%}
    .snout{position:absolute;width:54%;height:38%;left:23%;top:40%;border-radius:48% 48% 55% 55%;background:linear-gradient(#dca78a,#c98e75)}
    .nose{position:absolute;width:32%;height:24%;left:34%;top:8%;border-radius:55% 55% 48% 48%;background:#49302f;box-shadow:inset 0 3px #704a48}.mouth{position:absolute;left:50%;top:34%;width:20%;height:22%;border-left:3px solid #633936;border-bottom:3px solid #633936;border-radius:0 0 0 100%;transform:translateX(-1px)}
    .teeth{position:absolute;left:38%;top:57%;width:24%;height:24%;display:flex;gap:2px}.teeth:before,.teeth:after{content:"";flex:1;background:#fffdf1;border:2px solid #a98572;border-radius:2px 2px 5px 5px}.whiskers:before,.whiskers:after{content:"";position:absolute;top:57%;width:31%;height:2px;background:#6d4b40;box-shadow:0 7px #6d4b40}.whiskers:before{left:-15%;transform:rotate(8deg)}.whiskers:after{right:-15%;transform:rotate(-8deg)}
    .paws:before,.paws:after{content:"";position:absolute;bottom:5%;width:29%;height:22%;border-radius:50% 50% 42% 42%;background:#c88b70;border:3px solid #644131;box-shadow:inset 0 -4px #ad725c}.paws:before{left:5%;transform:rotate(12deg)}.paws:after{right:5%;transform:rotate(-12deg)}
    .mole.gold{background:linear-gradient(120deg,#f1b826,#ffe974 45%,#dc9213);border-color:#b66d0e;box-shadow:0 0 18px #fff68c}.mole.gold:before,.mole.gold:after{background:#f0bd32;border-color:#b66d0e}.mole.gold .snout{background:#fff0a8}.mole.gold:after{box-shadow:0 0 13px #fff}
    .fuse{display:none}.mole.bomb{width:66%;height:72%;left:17%;bottom:-75%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#62656b 0 7%,#292c32 24%,#111318 75%);border:5px solid #090b0e;box-shadow:inset -9px -10px 0 #0005;filter:drop-shadow(0 5px 3px #30492255)}.active .mole.bomb{bottom:10%}.mole.bomb:before,.mole.bomb:after{display:none}.mole.bomb .face,.mole.bomb .sparkles{display:none}.mole.bomb .fuse{display:block;position:absolute;width:38%;height:35%;left:59%;top:-27%;border-left:7px solid #493127;border-top:6px solid #493127;border-radius:60% 0 0 0}.mole.bomb .fuse:after{content:"✦";position:absolute;right:-11px;top:-15px;color:#fff59a;font-size:25px;text-shadow:0 0 5px #fff,0 0 10px #ff9f1a;animation:twinkle .25s infinite alternate}
    .sparkles{display:none}.gold .sparkles{display:block;position:absolute;inset:-14px;animation:twinkle .55s infinite alternate}.gold .sparkles:before{content:"✦";position:absolute;color:#fff;left:4%;top:18%;font-size:20px;text-shadow:35px -16px #fff6a9,72px 22px #fff,18px 69px #ffe45a}
    @keyframes twinkle{to{transform:rotate(8deg) scale(1.15);filter:brightness(1.3)}}
    .float-score{position:absolute;z-index:10;font-size:1.65rem;color:#fff;text-shadow:0 3px 0 #e35d31;pointer-events:none;animation:scoreUp .7s ease-out forwards;white-space:nowrap}.float-score.bonus{color:#fff79a;font-size:1.3rem;text-shadow:0 3px 0 #c77600,0 0 8px #fff}
    @keyframes scoreUp{0%{transform:translate(-50%,0) scale(.7);opacity:0}25%{opacity:1;transform:translate(-50%,-12px) scale(1.12)}100%{transform:translate(-50%,-58px) scale(1);opacity:0}}
    .board-wrap.boom{animation:boom .28s ease-in-out}.board-wrap.boom:after{content:"💥";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(4rem,18vw,8rem);z-index:30;pointer-events:none;animation:blast .35s forwards}@keyframes boom{25%{transform:translate(-8px,3px)}50%{transform:translate(8px,-3px)}75%{transform:translate(-5px,-2px)}}@keyframes blast{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}
    .controls{text-align:center;margin-top:24px;min-height:70px}
    button.main{font:inherit;font-size:1.35rem;color:#fff;background:linear-gradient(#ff9a4c,#f26a35);border:4px solid #fff2d7;border-radius:999px;padding:13px 36px;box-shadow:0 7px 0 #ba492b,0 11px 16px #704b3444;cursor:pointer;transition:.13s transform,.13s box-shadow}
    button.main:hover{transform:translateY(-2px) scale(1.03)}button.main:active{transform:translateY(5px);box-shadow:0 2px 0 #ba492b}button.main:disabled{background:#aaa;box-shadow:0 5px 0 #777;cursor:not-allowed;transform:none}
    .overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#357b3988;backdrop-filter:blur(3px);border-radius:33px;opacity:0;pointer-events:none;transition:.25s}
    .overlay.show{opacity:1;pointer-events:auto}.card{text-align:center;background:#fff8df;border:5px solid #fff;border-radius:30px;padding:25px 30px;box-shadow:0 9px 0 #e0a14c;transform:scale(.85);transition:.3s}.show .card{transform:scale(1)}.card h2{margin:0 0 6px;font-size:2rem;color:#ef6939}.card p{margin:5px 0 18px;font-size:1.15rem}.final{font-size:2.1rem;color:#6eb04e}
    .flowers{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 12% 72%,#fff 0 5px,transparent 6px),radial-gradient(circle at 85% 42%,#ffe750 0 5px,transparent 6px),radial-gradient(circle at 92% 80%,#fff 0 4px,transparent 5px),radial-gradient(circle at 4% 45%,#ffe750 0 4px,transparent 5px);opacity:.9}
    @media(max-width:480px){body{padding:10px}.board-wrap{padding-top:18px;border-radius:28px}.board{gap:8px}.mole{border-width:3px}.mole:before,.mole:after{border-width:3px}.hud{gap:7px}.stat{padding:7px 10px;border-width:3px}.stat strong{font-size:1.25rem}h1{font-size:2.6rem}.tag{font-size:.8rem}.controls{margin-top:17px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="flowers"></div>
  <main class="game" aria-label="두더지 팡팡 게임">
    <header><h1>두더지 팡팡!</h1><div class="tag">두더지를 톡톡 잡아보세요 🥕</div></header>
    <section class="hud" aria-live="polite">
      <div class="stat"><span>🏆 점수</span><strong id="score">0</strong></div>
      <div class="stat"><span>⏱ 남은 시간</span><strong><span id="time">30</span>초</strong></div>
    </section>
    <section class="board-wrap">
      <div class="board" id="board" aria-label="3×3 두더지 구멍"></div>
      <div class="overlay" id="overlay">
        <div class="card"><h2>게임 끝! 🎉</h2><p>정말 멋진 솜씨예요!</p><div class="final"><span id="finalScore">0</span>점</div><br><button class="main" id="restart">다시 시작</button></div>
      </div>
    </section>
    <div class="controls"><button class="main" id="start">게임 시작!</button></div>
  </main>
  <script>
    const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),startBtn=document.querySelector('#start'),overlay=document.querySelector('#overlay'),restartBtn=document.querySelector('#restart'),finalScore=document.querySelector('#finalScore');
    let score=0,time=30,playing=false,spawnTimer=null,countdownTimer=null,round=0;
    const activeHoles=new Set(),hideTimers=new Map();
    for(let i=0;i<9;i++){
      const hole=document.createElement('button'); hole.className='hole'; hole.type='button'; hole.setAttribute('aria-label',`${i+1}번 두더지 구멍`);
      hole.innerHTML='<span class="mole"><span class="sparkles"></span><span class="fuse"></span><span class="face"><span class="eyes"></span><span class="snout"><span class="nose"></span><span class="mouth"></span><span class="teeth"></span><span class="whiskers"></span></span><span class="paws"></span></span></span><span class="dirt"></span>';
      hole.addEventListener('pointerdown',()=>hit(hole)); board.appendChild(hole);
    }
    const holes=[...document.querySelectorAll('.hole')];
    function clearHole(hole){clearTimeout(hideTimers.get(hole));hideTimers.delete(hole);activeHoles.delete(hole);hole.classList.remove('active','hit');hole.querySelector('.mole').classList.remove('gold','bomb')}
    function clearMoles(){holes.forEach(clearHole)}
    function pace(){const elapsed=30-time;return Math.max(350,800-elapsed*15)}
    function maxMoles(){return time<=10?3:time<=20?2:1}
    function scheduleSpawn(){clearTimeout(spawnTimer);if(playing)spawnTimer=setTimeout(()=>{spawn();scheduleSpawn()},pace())}
    function spawn(){
      if(!playing||activeHoles.size>=maxMoles())return; const available=holes.filter(h=>!activeHoles.has(h));if(!available.length)return;const hole=available[Math.floor(Math.random()*available.length)],nextRound=round+1,bomb=nextRound%7===0||Math.random()<.08,gold=!bomb&&Math.random()<.15,type=bomb?'bomb':gold?'gold':'normal',mole=hole.querySelector('.mole');
      hole.classList.remove('hit'); mole.classList.remove('gold','bomb');
      activeHoles.add(hole); round=nextRound; hole.dataset.round=round; hole.dataset.type=type; mole.classList.toggle('gold',gold); mole.classList.toggle('bomb',bomb); hole.setAttribute('aria-label',bomb?'폭탄! 누르지 마세요':gold?'황금 두더지':'일반 두더지'); hole.classList.add('active');
      hideTimers.set(hole,setTimeout(()=>clearHole(hole),Math.max(650,pace()*2.1)));
    }
    function hit(hole){
      if(!playing||!activeHoles.has(hole)||!hole.classList.contains('active')||hole.classList.contains('hit'))return;
      clearTimeout(hideTimers.get(hole));hideTimers.delete(hole);activeHoles.delete(hole);const type=hole.dataset.type,bomb=type==='bomb',gold=type==='gold',points=bomb?-20:gold?50:10; score=Math.max(0,score+points); scoreEl.textContent=score; hole.classList.add('hit'); hole.classList.remove('active');
      const fx=document.createElement('span'); fx.className='float-score'+(gold?' bonus':''); fx.textContent=bomb?'💥 -20':gold?'✨ BONUS +50 ✨':'+10'; fx.style.left=(hole.offsetLeft+hole.offsetWidth/2)+'px'; fx.style.top=(hole.offsetTop+hole.offsetHeight*.42)+'px'; board.appendChild(fx); fx.addEventListener('animationend',()=>fx.remove());
      if(bomb){const wrap=document.querySelector('.board-wrap');wrap.classList.remove('boom');void wrap.offsetWidth;wrap.classList.add('boom');setTimeout(()=>wrap.classList.remove('boom'),380)}
      setTimeout(()=>hole.classList.remove('hit'),180);
      if(navigator.vibrate)navigator.vibrate(bomb?[60,30,80]:gold?[25,30,25]:18);
    }
    function startGame(){
      clearTimeout(spawnTimer);clearInterval(countdownTimer);document.querySelectorAll('.float-score').forEach(x=>x.remove());clearMoles();
      score=0;time=30;round=0;playing=true;scoreEl.textContent='0';timeEl.textContent='30';overlay.classList.remove('show');startBtn.disabled=true;startBtn.textContent='게임 중!';spawn();
      scheduleSpawn(); countdownTimer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000);
    }
    function endGame(){playing=false;clearTimeout(spawnTimer);clearInterval(countdownTimer);clearMoles();finalScore.textContent=score;overlay.classList.add('show');startBtn.disabled=false;startBtn.textContent='게임 시작!'}
    startBtn.addEventListener('click',startGame);restartBtn.addEventListener('click',startGame);
  </script>
</body>
</html>
